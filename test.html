<!DOCTYPE html>
<html>
<head>
  <title>the scratching tongues</title>
  <style>
    body {
      background-color: rgb(9, 0, 129);
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 0;
    }

    .container {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 250px;
      background-color: black;
      border-right: 2px dashed red;
      padding: 20px;
      overflow-y: auto;
      color: white;
    }

    .second-container {
      position: fixed;
      top: 0;
      left: 270px; /* space for sidebar + padding */
      right: 0;
      height: 100vh;
      padding: 20px;
      overflow-y: auto;
      color: white;
      text-align: center;
    }

    marquee {
      color: red;
      font-size: 16px;
    }

    h2 {
      font-weight: lighter;
      color: white;
      text-align: center;
      font-size: 16px;
    }

    img {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <marquee behavior="scroll">Welcome to the Official Website of Scratching Tongues</marquee>
    <img src="images/scratch/JPEG image-4A79-A744-B9-0.jpeg" style="width: 250px; height: auto;" />
    
    <p style="color: red; text-align: center;">--Upcoming Shows--</p> 
    <h2>7/24 - the waypost</h2>
    <h2>8/1 - hawthorne hideaway</h2>
    <div style="text-align: center;">
      <p>*</p>
      <iframe 
      style="border: 0; width: 190px; height: 332px;" 
      src="https://bandcamp.com/EmbeddedPlayer/album=922207217/size=large/bgcol=ffffff/linkcol=de270f/tracklist=false/transparent=true/" 
      seamless>
      <a href="https://scratchingtongues.bandcamp.com/album/im-in-love-with-a-fever-bee">I'm in Love with a Fever Bee by Scratching Tongues</a>
    </iframe>
    </div>
    <p></p>
  </div>

  <div class="second-container">
    <p>scratching tongues are josh, ben, patrick and aaron</p>
    <p>located in Portland, Oregon</p>
    <p>alien synth pop</p>
    <p>*</p>

    <img 
      id="red-image"
      src="images/scratch/red.jpg" 
      style="width: 500px; height: auto; border: 2px dashed red;"
      onclick="changeRedImage()"
    />



   
  </div>

  <script>
    const imageSources = [
      "images/scratch/red.jpg",
      "images/scratch/bw.jpg",
      "images/scratch/band.JPG",
      "images/scratch/guitars.jpg",
      "images/scratch/keys.JPG",
      "images/scratch/drums.jpg"
    ];

    let currentImageIndex = 0;

    function changeRedImage() {
      const img = document.getElementById("red-image");
      currentImageIndex = (currentImageIndex + 1) % imageSources.length;
      img.src = imageSources[currentImageIndex];
    }
  </script>

</body>
</html>
