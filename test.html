<!DOCTYPE html>
<html>
<head>
  <title>scratching tongues</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: rgb(9, 0, 129);
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 0;
      cursor: url('images/scratch/cursor.png'), auto;
    }

    img {
      cursor: none; /* hide system cursor over image */
      max-width: 100%;
      height: auto;
    }

    .container {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 250px;
      background-color: black;
      border-right: 2px dashed red;
      padding: 20px;
      overflow-y: auto;
      color: white;
    }

    .second-container {
      position: fixed;
      top: 0;
      left: 270px;
      right: 0;
      height: 100vh;
      padding: 20px;
      overflow-y: auto;
      color: white;
      text-align: center;
    }

    marquee {
      color: red;
      font-size: 16px;
    }

    h2 {
      font-weight: lighter;
      color: white;
      text-align: center;
      font-size: 16px;
    }

    iframe {
      width: 250px;
      height: 380px;
      border: 0;
    }

    #custom-cursor {
      position: fixed;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 9999;
      display: none;
    }

    /* Responsive layout for small screens */
    @media (max-width: 600px) {
      .container {
        position: relative;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 2px dashed red;
      }

      .second-container {
        position: relative;
        left: 0;
        top: 0;
        width: 100%;
        height: auto;
        padding: 10px;
      }

      iframe {
        width: 100% !important;
        height: auto;
      }

      marquee, h2 {
        font-size: 14px;
      }

      img {
        max-width: 100%;
        height: auto;
      }
    }

    /* Hide custom cursor on touch devices */
    @media (pointer: coarse) {
      #custom-cursor {
        display: none !important;
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <marquee behavior="scroll">Welcome to the Official Website of Scratching Tongues</marquee>
    <img src="images/scratch/JPEG image-4A79-A744-B9-0.jpeg" id="exploding-img"/>
    <script>
      const img = document.getElementById('exploding-img');
      img.addEventListener('click', () => {
        img.src = 'images/scratch/explode.gif';
        img.style.pointerEvents = 'none';
        setTimeout(() => {
          img.style.opacity = '0';
        }, 800);
      });
    </script>
    <p style="color: red; text-align: center;">--Upcoming Shows--</p>
    <h2>7/20 - overlook porchfest</h2>
    <h2>7/24 - the waypost</h2>
    <h2>8/1 - hawthorne hideaway</h2>
    <h2>8/16 - the shaku bar</h2>
    <div style="text-align: center;">
      <p>*</p>
      <iframe 
        src="https://bandcamp.com/EmbeddedPlayer/album=922207217/size=large/bgcol=ffffff/linkcol=de270f/tracklist=false/transparent=true/" 
        seamless>
      </iframe>
      <p>*</p>
    </div>
  </div>

  <div class="second-container">
    <img src="images/scratch/welcome_cat.gif" style="height: 50px;" />
    <p>scratching tongues are josh, ben, patrick and aaron</p>
    <p>alien synth pop located in Portland, Oregon</p>
    <p>*</p>

    <a href="testpong.html">
      <img src="images/scratch/tomato.gif" alt="Clickable Image">
    </a>

    <p></p>
    <img src="images/scratch/stars.gif" style="height: 500px; width: 150px;" />
    <img 
      id="red-image"
      src="images/scratch/red.jpg" 
      style="height: 500px;"
      onclick="changeRedImage()" 
    />
    <img src="images/scratch/stars.gif" style="height: 500px; width: 150px;" />
    <p>*</p>

    <a href="https://www.instagram.com/scratchingtongues/" target="_blank">
      <img src="images/scratch/ig.PNG" alt="Instagram" style="width: 50px;">
    </a>
    <a href="https://scratchingtongues.bandcamp.com" target="_blank">
      <img src="images/scratch/bc.PNG" alt="Bandcamp" style="width: 50px;">
    </a>
    <a href="https://open.spotify.com/artist/3FvJUBZdNzkRa4IEHKXNAr?si=eEyqzenITGyDtjJ9HSb2QQ" target="_blank">
      <img src="images/scratch/spotify.png" alt="Spotify" style="width: 50px;">
    </a>
    <a href="https://music.apple.com/ca/artist/scratching-tongues/1514594194" target="_blank">
      <img src="images/scratch/apple.png" alt="Apple Music" style="width: 50px;">
    </a>

    <div>*</div>
    <p>contact us</p>

    <a href="testcontact.html">
      <img src="images/scratch/contacvty.gif" style="margin-bottom: 50px;" alt="Contact">
    </a>

    <img id="custom-cursor" src="images/scratch/cokecan.gif"  alt="Custom Cursor">
  </div>

  <script>
    const cursor = document.getElementById('custom-cursor');

    document.addEventListener('mousemove', function(e) {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('mouseenter', () => {
        cursor.style.display = 'block';
      });
      img.addEventListener('mouseleave', () => {
        cursor.style.display = 'none';
      });
    });

    const imageSources = [
      "images/scratch/red.jpg",
      "images/scratch/bw.jpg",
      "images/scratch/band.JPG",
      "images/scratch/guitars.jpg",
      "images/scratch/keys.JPG",
      "images/scratch/drums.jpg"
    ];

    let currentImageIndex = 0;

    function changeRedImage() {
      const img = document.getElementById("red-image");
      currentImageIndex = (currentImageIndex + 1) % imageSources.length;
      img.src = imageSources[currentImageIndex];
    }
  </script>

</body>
</html>
