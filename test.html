  <script>
    const cursor = document.getElementById('custom-cursor');
  
    // Move the custom cursor with the mouse
    document.addEventListener('mousemove', function (e) {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
  
    // Show custom cursor when hovering over images
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('mouseenter', () => {
        cursor.style.display = 'block';
      });
      img.addEventListener('mouseleave', () => {
        cursor.style.display = 'none';
      });
    });
 
  

    const imageSources = [
      "images/scratch/red.jpg",  
      "images/scratch/bw.jpg",
      "images/scratch/band.JPG",
      "images/scratch/guitars.jpg",
      "images/scratch/keys.JPG",
      "images/scratch/drums.jpg"
    ];

    let currentImageIndex = 0;

    function changeRedImage() {
      const img = document.getElementById("red-image");
      currentImageIndex = (currentImageIndex + 1) % imageSources.length;
      img.src = imageSources[currentImageIndex];
      style= "height:500px;width:auto;"

    }
  </script>
