<!DOCTYPE html>
<html>
<head>
  <title>scratching tongues</title>
    <style>
         body {
      background-color: rgb(9, 0, 129);
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 0;
      cursor: url('images/scratch/cursor.png'), auto;
    }
    img {
      cursor: none; /* hide system cursor over image */
      
    }
    #custom-cursor {
      position: fixed;
      width: 32px; /* adjust to your image size */
      height: 32px;
      pointer-events: none; /* So it doesn't block clicks */
      z-index: 9999;
      display: none;
    }
    </style>
     <a href="test.html"><img src="images/scratch/homepage.gif" style="padding-left: 50px; padding-top: 50px; width:150px; height: auto;" alt="contact"></a>
     <div>  </div>
     <img id="custom-cursor" src="images/scratch/cokecan.gif" alt="Custom Cursor">
   </div>
     <script>
       const cursor = document.getElementById('custom-cursor');
   
       // Move the custom cursor with the mouse
       document.addEventListener('mousemove', function(e) {
         cursor.style.left = e.clientX + 'px';
         cursor.style.top = e.clientY + 'px';
       });
   
       // Show custom cursor only when hovering over images
       document.querySelectorAll('img').forEach(img => {
         img.addEventListener('mouseenter', () => {
           cursor.style.display = 'block';
         });
         img.addEventListener('mouseleave', () => {
           cursor.style.display = 'none';
         });
       });
   </script>
