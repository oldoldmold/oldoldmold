<!DOCTYPE html>
<html>
  <head>
    <title>scratching tongues</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      img, input, textarea, button {
        cursor: none;
      }
  
      #custom-cursor {
        position: fixed;
        width: 32px;
        height: 32px;
        pointer-events: none;
        z-index: 9999;
        display: none;
      }
  
      body {
        text-align: center;
        font-family: 'Courier New', monospace;
        font-weight: lighter;
        margin: 35px 0 20px 0 !important;
        color: white;
        background-color: rgb(9, 0, 129);
        cursor: url('images/scratch/cursor.png'), auto;
      }

      h1 {font-family: 'Courier New', monospace;
    font-weight: lighter;
  }
  
      .form-control {
        width: 90%;
        max-width: 500px;
        padding: 12px;
        font-size: 16px;
        font-weight: lighter;
        margin: 10px auto;
        border: 2px dashed red;
        background-color: black;
        color: white;
        font-family: 'Courier New', monospace;
        display: block;
      }
  
      textarea.form-control {
        height: 200px;
        resize: vertical;
      }
  
      button.btn {
        font-size: 18px;
        padding: 12px 24px;
        background-color: rgb(253, 63, 63);
        color: black;
        border: none;
        font-family: 'Courier New', monospace;
        margin-top: 15px;
      }
  
      button.btn:hover {
        background-color: darkred;
      }
  
      @media (max-width: 768px) {
        input, textarea, button, img {
          cursor: none;
        }
  
        body {
          overflow-x: hidden;
        }
  
        
      }
  
      @media (pointer: coarse) {
        #custom-cursor {
          display: none !important;
        }
      }
    </style>
  </head>
  
   

  
<body>
  <div>  
    <img id="custom-cursor" src="images/scratch/cokecan.gif" alt="Custom Cursor">
  </div>
  <a href="test.html"><img src="images/scratch/homepage.gif"  alt="contact"></a>

  <div class="container">
    <h1>contact us</h1>
    <form action="https://formcarry.com/s/hOkR6t4eO3s" method="POST" accept-charset="UTF-8">
      <input type="text" name="name" class="form-control" placeholder="Full Name" required>
      <input type="email" name="email" class="form-control" placeholder="Email Address" required>
      <textarea name="message" class="form-control" placeholder="Your Message" required></textarea>
    
      <input type="hidden" name="_redirect" value="http://oldoldmold.xyz/testthanks.html">
      
      <button type="submit" class="btn">Send Email</button>
      
    </form>

    <img src="images/scratch/dj.gif" style="height: 100px; width:auto; margin-top: 30px;">
  </div>

   <script>
    const cursor = document.getElementById('custom-cursor');
  
    // Move the custom cursor with the mouse
    document.addEventListener('mousemove', function(e) {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
  
    // Show custom cursor on certain interactive elements
    const targets = document.querySelectorAll('img, input, textarea, button');
  
    targets.forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.style.display = 'block';
      });
      el.addEventListener('mouseleave', () => {
        cursor.style.display = 'none';
      });
    });
  </script>

  </body>
   
</html>
