<!DOCTYPE html>
<html>
<head>
  <title>scratching tongues</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: rgb(9, 0, 129);
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 0;
      cursor: url('images/scratch/cursor.png'), auto;
      overflow-x: hidden;
    }

    img {
      cursor: none;
      max-width: 100%;
      height: auto;
      display: block; 
      margin: 0 auto
    }

    #custom-cursor {
      position: fixed;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 9999;
      display: none;
    }
    </style>
</head>

<body>
   
  <img id="custom-cursor" src="images/scratch/cokecan.gif" alt="Custom Cursor">
    
    <a href="test.html">
<img src="images/scratch/back2.png" style="width:80px; height: auto; margin-top: 50px;" >
</a>


<div style="max-width: 1000px; margin: 100px auto 0 auto;">
  <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
    <iframe src="https://www.youtube.com/embed/Zzal-36eIoY" 
            title="YouTube video player" 
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen 
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
    </iframe>
  </div>
</div>

</body>

<script>
    const cursor = document.getElementById('custom-cursor');
  
    // Move the custom cursor with the mouse
    document.addEventListener('mousemove', function (e) {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
  
    // Show custom cursor when hovering over images
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('mouseenter', () => {
        cursor.style.display = 'block';
      });
      img.addEventListener('mouseleave', () => {
        cursor.style.display = 'none';
      });
    });
 </script>
