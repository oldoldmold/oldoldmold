<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8" />
  <title>Pong Game</title>
  <style>
    canvas {
      display: block;
      margin: 0 auto;
      background: black;
      width: 100%;
  height: auto;
  max-width: 1000px;
  display: block;
  margin: 0 auto;
  touch-action: none;

    }
    body, canvas {
      background-color: rgb(9, 0, 129);
      font-family: 'Courier New', monospace;
      cursor: url('images/scratch/cursor.png'), auto;
    }
    #hands {
        cursor: url('images/scratch/hands.png'), auto;
    }
  </style>
</head>
<body>
    <nav>
        <a href="test.html"><img src="images/scratch/back.png" style="height: 100px; width: auto;" alt="back" id="hands"></a>
    </nav>
  <canvas id="pong" width="900" height="600"></canvas>
<style></style>
  <script>
    const canvas = document.getElementById("pong");
    const ctx = canvas.getContext("2d");

    // Ball
    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 10,
      speed: 5,
      velocityX: 5,
      velocityY: 5,
      color: "YELLOW"
    };

    // Paddle
    const paddleWidth = 10, paddleHeight = 100;

    const user = {
      x: 0,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      color: "RED",
      score: 0
    };

    const com = {
      x: canvas.width - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      color: "RED",
      score: 0
    };

    function drawRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function drawCircle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2, false);
      ctx.closePath();
      ctx.fill();
    }

    function drawText(text, x, y) {
      ctx.fillStyle = "WHITE";
      ctx.font = "45px Arial";
      ctx.fillText(text, x, y);
    }

    function render() {
      drawRect(0, 0, canvas.width, canvas.height, "BLACK");
      drawText(user.score, canvas.width/4, 50);
      drawText(com.score, 3*canvas.width/4, 50);
      drawRect(user.x, user.y, user.width, user.height, user.color);
      drawRect(com.x, com.y, com.width, com.height, com.color);
      drawCircle(ball.x, ball.y, ball.radius, ball.color);
    }

    function controlUserPaddle(evt) {
      user.y = evt.clientY - canvas.getBoundingClientRect().top - user.height/2;
    }
    canvas.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
    canvas.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
    canvas.addEventListener("mousemove", controlUserPaddle);
    canvas.addEventListener("touchmove", function(evt) {
  const touch = evt.touches[0];
  user.y = touch.clientY - canvas.getBoundingClientRect().top - user.height / 2;
});
    function collision(b, p) {
      b.top = b.y - b.radius;
      b.bottom = b.y + b.radius;
      b.left = b.x - b.radius;
      b.right = b.x + b.radius;

      p.top = p.y;
      p.bottom = p.y + p.height;
      p.left = p.x;
      p.right = p.x + p.width;

      return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
    }

    function resetBall() {
      ball.x = canvas.width/2;
      ball.y = canvas.height/2;
      ball.velocityX = -ball.velocityX;
      ball.speed = 5;
    }

    function update() {
      ball.x += ball.velocityX;
      ball.y += ball.velocityY;

      // AI
      com.y += (ball.y - (com.y + com.height/2)) * 0.1;

      // Collision with top and bottom
      if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
        ball.velocityY = -ball.velocityY;
      }

      // Check paddle hit
      let player = (ball.x < canvas.width/2) ? user : com;

      if (collision(ball, player)) {
        let collidePoint = ball.y - (player.y + player.height/2);
        collidePoint = collidePoint / (player.height/2);
        let angleRad = collidePoint * Math.PI/4;
        let direction = (ball.x < canvas.width/2) ? 1 : -1;
        ball.velocityX = direction * ball.speed * Math.cos(angleRad);
        ball.velocityY = ball.speed * Math.sin(angleRad);
        ball.speed += 0.2;
      }

      // Score
      if (ball.x - ball.radius < 0) {
        com.score++;
        resetBall();
      } else if (ball.x + ball.radius > canvas.width) {
        user.score++;
        resetBall();
      }
    }

    function game() {
      update();
      render();
    }

    const framePerSecond = 60;
    setInterval(game, 1000 / framePerSecond);
  

  </script>

</body>
</html>
